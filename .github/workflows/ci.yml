name: CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Global defaults; jobs also set a per-job LOG_DB_PATH for isolation
  COACH_ENABLED: "false"
  PYTHONHASHSEED: "0"

jobs:
  lint-python:
    name: Lint & Typecheck (Python)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.8 black==24.8.0 mypy==1.11.2

      - name: Ruff
        run: ruff check .

      - name: Black (check)
        run: black --check .

      - name: Mypy (backend)
        run: mypy backend

  build-and-lint-web:
    name: Build & Lint (Frontend)
    runs-on: ubuntu-24.04
    needs: lint-python
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: Lint (eslint) if present
        run: npm run lint --if-present

      - name: Typecheck (tsc) if present
        run: npm run typecheck --if-present

      - name: Build (Next) if present
        run: npm run build --if-present

  unit-tests:
    name: Unit Tests (Backend)
    runs-on: ubuntu-24.04
    needs: lint-python
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-unit.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-xdist

      - name: Run tests
        run: pytest -q -n auto backend/tests

      - name: Upload pytest report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-unit
          path: |
            ./.data/**
            ./pytest-report.xml
          if-no-files-found: ignore

  export-contract:
    name: Export Contract Tests
    runs-on: ubuntu-24.04
    needs: unit-tests
    if: ${{ hashFiles('backend/tests/test_exports.py', 'backend/tests/test_export_roundtrip.py') != '' }}
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-export.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest
      - name: Run export contract tests
        run: |
          pytest -q backend/tests/test_exports.py backend/tests/test_export_roundtrip.py

  docs-contract:
    name: Docs Examples Drift
    runs-on: ubuntu-24.04
    needs: unit-tests
    if: ${{ hashFiles('docs/scripts/capture_examples.py') != '' }}
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-docs.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Capture fresh examples
        run: |
          mkdir -p .tmp-docs-examples
          python docs/scripts/capture_examples.py --out .tmp-docs-examples --seed ci --db "$LOG_DB_PATH"
      - name: Diff against committed examples
        run: |
          if [ -d docs/examples ]; then
            diff -ruN docs/examples .tmp-docs-examples
          else
            echo "No docs/examples directory to compare against"; exit 1
          fi
      - name: Upload diff (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-drift
          path: .tmp-docs-examples

  packaging-check:
    name: Packaging Hygiene
    runs-on: ubuntu-24.04
    needs: unit-tests
    if: ${{ hashFiles('tools/build_dist.py') != '' }}
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-pack.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Build dist
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python tools/build_dist.py --include-file dist-include.txt --out-dir dist
          mkdir -p .tmp-dist && unzip -q dist/*.zip -d .tmp-dist
      - name: Forbidden content check
        run: |
          set -e
          if grep -R -E '(\.venv/|__pycache__/|\.pytest_cache/|node_modules/|\.next/|third_party/|\.git/|\.DS_Store)' .tmp-dist; then
            echo "Forbidden content found in dist"; exit 1
          else
            echo "No forbidden content found."
          fi
      - name: Required files present
        run: |
          test -f .tmp-dist/backend/main.py
          test -f .tmp-dist/Makefile
          test -f .tmp-dist/requirements.txt
          test -f .tmp-dist/backend/requirements.txt || true
          test -f .tmp-dist/DIST-CONTENTS.md
      - name: Dependency sanity (optional)
        run: |
          python -m venv .venv-dist
          . .venv-dist/bin/activate
          pip install --upgrade pip
          pip install -r .tmp-dist/requirements.txt || true
          pip check || true
      - name: Upload dist (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-debug
          path: |
            dist/**
            .tmp-dist/**

  autoplay-smoke:
    name: Autoplay Smoke (50 hands, coach off)
    runs-on: ubuntu-24.04
    needs: unit-tests
    if: ${{ hashFiles('backend/scripts/autoplay.py') != '' }}
    timeout-minutes: 10
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-autoplay.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Run autoplay 50 hands
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          try:
              from backend.scripts.autoplay import run_autoplay
          except Exception as e:
              print("[autoplay-smoke] Failed to import run_autoplay:", e)
              sys.exit(1)
          try:
              run_autoplay(num_hands=50, base_seed='ci-smoke')
              print("[autoplay-smoke] Completed 50 hands OK")
          except Exception as e:
              print("[autoplay-smoke] FAILED:", e)
              sys.exit(1)
          PY

  coach-off-guard:
    name: Coach Disabled Guard (expects 501)
    runs-on: ubuntu-24.04
    needs: unit-tests
    if: ${{ hashFiles('backend/**/coach*.py') != '' && hashFiles('backend/**/main.py') != '' }}
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-coach.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Assert 501 from /api/coach/advice when disabled
        run: |
          python - <<'PY'
          import sys
          try:
              from fastapi.testclient import TestClient
              from backend.main import app
          except Exception as e:
              print("Cannot import app/TestClient:", e)
              sys.exit(1)
          client = TestClient(app)
          r = client.get("/api/coach/advice?hand_id=H1&idx=0")
          if r.status_code != 501:
              print("Expected 501, got", r.status_code, "body:", r.text)
              sys.exit(1)
          print("Coach disabled guard OK (501).")
          PY
