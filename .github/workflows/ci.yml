name: CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COACH_ENABLED: "false"
  PYTHONHASHSEED: "0"

jobs:
  lint-python:
    name: Lint & Typecheck (Python)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.8 black==24.8.0 mypy==1.11.2

      - name: Ruff
        run: ruff check .

      - name: Black (check)
        run: black --check .

      - name: Mypy (backend)
        run: mypy --config-file .mypy.ini backend

  build-and-lint-web:
    name: Build & Lint (Frontend)
    runs-on: ubuntu-24.04
    needs: lint-python
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend
        id: detect_frontend
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi
        shell: bash
        working-directory: .

      - name: Use Node 20
        if: steps.detect_frontend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.detect_frontend.outputs.present == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: Lint (eslint) if present
        if: steps.detect_frontend.outputs.present == 'true'
        run: npm run lint --if-present

      - name: Typecheck (tsc) if present
        if: steps.detect_frontend.outputs.present == 'true'
        run: npm run typecheck --if-present

      - name: Build (Next) if present
        if: steps.detect_frontend.outputs.present == 'true'
        run: npm run build --if-present

      - name: Skip (no frontend)
        if: steps.detect_frontend.outputs.present != 'true'
        run: echo "No frontend detected; job skipped."

  unit-tests:
    name: Unit Tests (Backend)
    runs-on: ubuntu-24.04
    needs: lint-python
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-unit.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-xdist

      - name: Run tests
        run: pytest -q backend/tests

  unit-tests-ompeval:
    name: Unit Tests (Backend, OMPEval native + Eval7)
    runs-on: ubuntu-24.04
    needs: lint-python
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-unit-ompeval.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
      EQUITY_BACKEND_POLICY: "auto"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Install backend deps (base)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Install optional deps (Eval7 + build helpers)
        run: |
          if [ -f backend/requirements-optional.txt ]; then
            pip install -r backend/requirements-optional.txt || true
          fi
          pip install --upgrade scikit-build-core pybind11

      - name: Build & install OMPEval native extension
        run: |
          if [ -d backend/native/ompeval ]; then
            pip install ./backend/native/ompeval
            python - <<'PY'
            import sys
            try:
                import ompeval  # noqa:F401
                print("[ompeval] import OK")
            except Exception as e:
                print("[ompeval] import FAILED:", e)
                sys.exit(1)
            PY
          else
            echo "backend/native/ompeval not found; skipping native build."
          fi

      - name: Install test tooling
        run: pip install pytest pytest-xdist

      - name: Run backend tests (native-enabled)
        run: pytest -q backend/tests

      - name: Run equity benchmark (tiny matrix)
        run: |
          mkdir -p .bench
          python -m backend.scripts.benchmark_equity --policies auto,ompeval,eval7 --out .bench/bench_equity.csv

      - name: Upload equity benchmark CSV
        uses: actions/upload-artifact@v4
        with:
          name: equity-bench-ompeval
          path: .bench/bench_equity.csv
          if-no-files-found: warn

  export-contract:
    name: Export Contract Tests
    runs-on: ubuntu-24.04
    needs: unit-tests
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-export.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect export tests
        id: detect_export_tests
        run: |
          if [ -f backend/tests/test_exports.py ] || [ -f backend/tests/test_export_roundtrip.py ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.detect_export_tests.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        if: steps.detect_export_tests.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest

      - name: Run export contract tests
        if: steps.detect_export_tests.outputs.present == 'true'
        run: |
          pytest -q backend/tests/test_exports.py backend/tests/test_export_roundtrip.py

      - name: Skip (no export tests)
        if: steps.detect_export_tests.outputs.present != 'true'
        run: echo "No export tests found; job skipped."

  docs-contract:
    name: Docs Examples Drift
    runs-on: ubuntu-24.04
    needs: unit-tests
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-docs.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect capture script
        id: detect_capture
        run: |
          if [ -f docs/scripts/capture_examples.py ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.detect_capture.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        if: steps.detect_capture.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Regenerate examples (writes into docs/examples)
        if: steps.detect_capture.outputs.present == 'true'
        run: |
          python docs/scripts/capture_examples.py

      - name: Check drift via git diff
        if: steps.detect_capture.outputs.present == 'true'
        run: |
          if git diff --quiet -- docs/examples; then
            echo "No docs/examples drift."
          else
            echo "Docs examples drift detected. Please regenerate & commit."
            git diff -- docs/examples | tee docs_examples.diff
            exit 1
          fi

      - name: Upload drift diff (on failure)
        if: failure() && steps.detect_capture.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-drift
          path: |
            docs/examples/**
            docs_examples.diff
          if-no-files-found: warn

      - name: Skip (no capture script)
        if: steps.detect_capture.outputs.present != 'true'
        run: echo "No docs/scripts/capture_examples.py; job skipped."

  packaging-check:
    name: Packaging Hygiene
    runs-on: ubuntu-24.04
    needs: unit-tests
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-pack.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect dist builder
        id: detect_dist
        run: |
          if [ -f tools/build_dist.py ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.detect_dist.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build dist
        if: steps.detect_dist.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python tools/build_dist.py --include-file dist-include.txt --out-dir dist
          mkdir -p .tmp-dist && unzip -q dist/*.zip -d .tmp-dist

      - name: Enforce slim size (< 1 MiB)
        if: steps.detect_dist.outputs.present == 'true'
        run: |
          BYTES=$(stat -c%s dist/nlh-trainer-*.zip)
          echo "ZIP size: $BYTES bytes"
          if [ "$BYTES" -gt 1048576 ]; then
            echo "Archive too large (>1 MiB). Check allowlist and exclusions."
            exit 1
          fi

      - name: Determine extracted root
        if: steps.detect_dist.outputs.present == 'true'
        id: find_root
        run: |
          set -euo pipefail
          ROOT_DIR=".tmp-dist"
          if [ -f "$ROOT_DIR/backend/main.py" ]; then
            echo "root=$ROOT_DIR" >> $GITHUB_OUTPUT
            exit 0
          fi
          mapfile -t CANDIDATES < <(find "$ROOT_DIR" -mindepth 1 -maxdepth 1 -type d | sort)
          if [ "${#CANDIDATES[@]}" -eq 1 ]; then
            ROOT_DIR="${CANDIDATES[0]}"
          else
            MATCH_PARENT="$(dirname "$(find "$ROOT_DIR" -type f -path "*/backend/main.py" | head -n 1 || true)")"
            if [ -n "$MATCH_PARENT" ]; then
              ROOT_DIR="$MATCH_PARENT"
            fi
          fi
          echo "root=$ROOT_DIR" >> $GITHUB_OUTPUT
          find "$ROOT_DIR" -maxdepth 2 -type f | sort

      - name: Forbidden content check
        if: steps.detect_dist.outputs.present == 'true'
        run: |
          set -e
          ROOT="${{ steps.find_root.outputs.root }}"
          BAD_DIRS="$(find "$ROOT" -type d \( \
            -name '.venv' -o \
            -name '__pycache__' -o \
            -name '.pytest_cache' -o \
            -name 'node_modules' -o \
            -name '.next' -o \
            -name 'third_party' -o \
            -name '.git' \
          \))"
          if [ -n "$BAD_DIRS" ]; then
            echo "Forbidden directories found in dist:"
            echo "$BAD_DIRS"
            exit 1
          fi
          BAD_FILES="$(find "$ROOT" -type f -name '.DS_Store')"
          if [ -n "$BAD_FILES" ]; then
            echo "Forbidden files found in dist:"
            echo "$BAD_FILES"
            exit 1
          fi
          echo "No forbidden content found."

      - name: Required files present
        if: steps.detect_dist.outputs.present == 'true'
        run: |
          set -e
          ROOT="${{ steps.find_root.outputs.root }}"
          test -f "$ROOT/backend/main.py"
          test -f "$ROOT/Makefile"
          test -f "$ROOT/requirements.txt"
          test -f "$ROOT/backend/requirements.txt" || true
          test -f "$ROOT/DIST-CONTENTS.md"
          test -f "$ROOT/docs/examples/export_hand.json"
          test -f "$ROOT/docs/examples/export_session.json"

      - name: Upload dist (on failure)
        if: failure() && steps.detect_dist.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-debug
          path: |
            dist/**
            .tmp-dist/**

  autoplay-smoke:
    name: Autoplay Smoke (50 hands, coach off)
    runs-on: ubuntu-24.04
    needs: unit-tests
    timeout-minutes: 10
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-autoplay.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect autoplay script
        id: detect_autoplay
        run: |
          if [ -f backend/scripts/autoplay.py ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.detect_autoplay.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        if: steps.detect_autoplay.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run autoplay 50 hands
        if: steps.detect_autoplay.outputs.present == 'true'
        run: |
          python - <<'PY'
          import sys
          try:
              from backend.scripts.autoplay import run_autoplay
          except Exception as e:
              print("[autoplay-smoke] Failed to import run_autoplay:", e)
              sys.exit(1)
          try:
              run_autoplay(num_hands=50, base_seed='ci-smoke')
              print("[autoplay-smoke] Completed 50 hands OK")
          except Exception as e:
              print("[autoplay-smoke] FAILED:", e)
              sys.exit(1)
          PY

      - name: Skip (no autoplay)
        if: steps.detect_autoplay.outputs.present != 'true'
        run: echo "No backend/scripts/autoplay.py; job skipped."

  coach-off-guard:
    name: Coach Disabled Guard (expects 501)
    runs-on: ubuntu-24.04
    needs: unit-tests
    env:
      LOG_DB_PATH: ${{ github.workspace }}/.data/ci-coach.sqlite
      COACH_ENABLED: "false"
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Coach API
        id: detect_coach
        run: |
          if [ -f backend/api/coach.py ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.detect_coach.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        if: steps.detect_coach.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Assert 501 from /api/coach/advice when disabled (or skip if route missing)
        if: steps.detect_coach.outputs.present == 'true'
        run: |
          python - <<'PY'
          import sys
          from fastapi.testclient import TestClient
          try:
              from backend.main import app
          except Exception as e:
              print("Cannot import app:", e); sys.exit(1)
          client = TestClient(app)
          r = client.get("/api/coach/advice?hand_id=H1&idx=0")
          if r.status_code == 404:
              print("Coach API route not wired; skipping guard."); sys.exit(0)
          if r.status_code != 501:
              print("Expected 501, got", r.status_code, "body:", r.text); sys.exit(1)
          print("Coach disabled guard OK (501).")
          PY

      - name: Skip (no Coach API)
        if: steps.detect_coach.outputs.present != 'true'
        run: echo "No backend/api/coach.py; job skipped."
