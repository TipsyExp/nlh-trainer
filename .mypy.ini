# .mypy.ini
[mypy]
python_version = 3.12
files = backend
exclude = ^backend/tests/

ignore_missing_imports = True
follow_imports = silent

# Silence "Library stubs not installed" noise (yaml, etc.)
disable_error_code = import-untyped

# If you want to be a bit stricter later, remove the lines below after code fixes.
[mypy-backend.adapters.engines.pokerkit_adapter]
disable_error_code = arg-type

[mypy-backend.database]
disable_error_code = return-value
