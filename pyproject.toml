[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

# If you want custom lint rules later, add them under [tool.ruff.lint].
# Leaving it empty avoids the deprecation warning you were seeing.
# [tool.ruff.lint]
# extend-select = ["E", "F"]

[tool.mypy]
# Match the CI runtime
python_version = "3.12"

# IMPORTANT: tell mypy exactly what to check (avoids invalid package names)
files = ["backend"]

plugins = []
ignore_missing_imports = true
follow_imports = "silent"
